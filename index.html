<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DataMatrix Scanner</title>
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.js"></script>
    <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .header {
            padding: 16px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border: 2px solid rgba(0, 200, 255, 0.6);
            border-radius: 16px;
            pointer-events: none;
            transition: border-color 0.3s;
        }

        .scan-overlay.detected {
            border-color: #00e676;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.3);
        }

        .scan-overlay::before,
        .scan-overlay::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00c8ff;
            border-style: solid;
        }

        .scan-overlay::before {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
            border-radius: 16px 0 0 0;
        }

        .scan-overlay::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 16px 0;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00c8ff, transparent);
            animation: scanMove 2s ease-in-out infinite;
            border-radius: 2px;
        }

        @keyframes scanMove {
            0%, 100% { top: 10px; }
            50% { top: calc(100% - 10px); }
        }

        .status-bar {
            padding: 12px 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            text-align: center;
            z-index: 10;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .status-text {
            font-size: 13px;
            color: #aaa;
            transition: all 0.3s;
        }

        .status-text.active {
            color: #00e676;
            font-weight: 500;
        }

        .decoded-content {
            font-size: 12px;
            color: #00c8ff;
            margin-top: 4px;
            word-break: break-all;
            max-width: 100%;
            display: none;
        }

        .decoded-content.visible {
            display: block;
        }

        .controls {
            padding: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-capture {
            background: linear-gradient(135deg, #00c8ff, #0088cc);
            color: #fff;
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.95);
        }

        .btn-capture.enabled {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
            box-shadow: 0 4px 20px rgba(0, 200, 255, 0.4);
            animation: pulse 2s infinite;
        }

        .btn-capture.enabled:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(0, 200, 255, 0.4); }
            50% { box-shadow: 0 4px 30px rgba(0, 200, 255, 0.7); }
        }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-reset:active {
            background: rgba(255,255,255,0.2);
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.1s;
        }

        .flash-overlay.flash {
            opacity: 0.8;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00c8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            color: #888;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #00e676;
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 50;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .camera-icon, .scan-icon, .download-icon, .reset-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p class="loading-text">Inicializando cámara...</p>
    </div>

    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="toast" id="toast"></div>

    <div class="app-container">
        <div class="header">
            <h1>📷 DataMatrix Scanner</h1>
            <p>Apunta al código DataMatrix para escanear</p>
        </div>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-overlay" id="scanOverlay">
                <div class="scan-line"></div>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-text" id="statusText">Buscando DataMatrix...</span>
            <span class="decoded-content" id="decodedContent"></span>
        </div>

        <div class="controls">
            <button class="btn btn-capture" id="btnCapture" disabled>
                <svg class="camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                Tomar Foto
            </button>
            <button class="btn btn-reset" id="btnReset">
                <svg class="reset-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Reset
            </button>
        </div>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const btnCapture = document.getElementById('btnCapture');
        const btnReset = document.getElementById('btnReset');
        const statusText = document.getElementById('statusText');
        const decodedContent = document.getElementById('decodedContent');
        const scanOverlay = document.getElementById('scanOverlay');
        const loadingScreen = document.getElementById('loadingScreen');
        const flashOverlay = document.getElementById('flashOverlay');
        const captureCanvas = document.getElementById('captureCanvas');
        const toast = document.getElementById('toast');

        let codeReader = null;
        let detectedCode = null;
        let scanning = true;
        let stream = null;

        async function initCamera() {
            try {
                // Primero intentamos obtener la cámara trasera en alta resolución
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 3840 },
                        height: { ideal: 2160 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                await video.play();

                // Mostrar info de resolución
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                console.log(`Resolución: ${settings.width}x${settings.height}`);

                loadingScreen.classList.add('hidden');
                initScanner();

            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                statusText.textContent = 'Error: No se pudo acceder a la cámara';
                statusText.style.color = '#ff5252';
                loadingScreen.classList.add('hidden');
            }
        }

        async function initScanner() {
            try {
                codeReader = new ZXingBrowser.BrowserMultiFormatReader();

                const controls = codeReader.listVideoInputDevices();
                
                // Empezar decodificación continua
                codeReader.decodeFromVideoElement(video, (result, err) => {
                    if (result) {
                        onCodeDetected(result.getText());
                    }
                });

            } catch (err) {
                console.error('Error al inicializar el escáner:', err);
                statusText.textContent = 'Error al iniciar el escáner';
            }
        }

        function onCodeDetected(text) {
            if (!scanning) return;

            detectedCode = text;
            statusText.textContent = '✅ DataMatrix detectado';
            statusText.classList.add('active');
            decodedContent.textContent = `Contenido: ${text}`;
            decodedContent.classList.add('visible');
            scanOverlay.classList.add('detected');

            // Activar botón
            btnCapture.disabled = false;
            btnCapture.classList.add('enabled');
        }

        function capturePhoto() {
            if (!detectedCode) return;

            // Flash effect
            flashOverlay.classList.add('flash');
            setTimeout(() => flashOverlay.classList.remove('flash'), 150);

            // Obtener resolución del video
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;

            // Configurar canvas a resolución del video (4K si está disponible)
            captureCanvas.width = videoWidth;
            captureCanvas.height = videoHeight;

            const ctx = captureCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

            // Convertir a blob y descargar
            captureCanvas.toBlob((blob) => {
                // Sanitizar nombre del archivo
                let fileName = sanitizeFileName(detectedCode);
                if (!fileName) fileName = 'datamatrix_photo';

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${fileName}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast(`📸 Foto guardada: ${fileName}.jpg`);

            }, 'image/jpeg', 1.0); // Máxima calidad JPEG
        }

        function sanitizeFileName(name) {
            // Reemplazar caracteres no válidos para nombres de archivo
            return name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').trim().substring(0, 100);
        }

        function resetScan() {
            detectedCode = null;
            scanning = true;
            statusText.textContent = 'Buscando DataMatrix...';
            statusText.classList.remove('active');
            decodedContent.classList.remove('visible');
            scanOverlay.classList.remove('detected');
            btnCapture.disabled = true;
            btnCapture.classList.remove('enabled');
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => {
                toast.classList.remove('visible');
            }, 3000);
        }

        // Event listeners
        btnCapture.addEventListener('click', capturePhoto);
        btnReset.addEventListener('click', resetScan);

        // Iniciar
        initCamera();
    </script>
</body>
</html>
