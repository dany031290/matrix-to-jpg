<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto DataMatrix</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0d10;--fg:#f2f4f7;--muted:#9aa3ad;--ok:#22c55e;--warn:#f59e0b;--btn:#2563eb;--btn-off:#2a2f36}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d10;--fg:#f2f4f7}}
:root[data-theme="dark"]{--bg:#0b0d10;--fg:#f2f4f7}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}
#frame{position:absolute;inset:0;margin:auto;width:60%;aspect-ratio:1;max-height:60%;border:3px solid var(--muted);border-radius:14px;pointer-events:none;transition:border-color .15s}
#frame.ok{border-color:var(--ok);box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
#status{position:absolute;left:12px;right:12px;top:12px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.6);font-size:15px;text-align:center;word-break:break-all}
#status.ok{color:var(--ok)}
#bar{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
#shot{width:100%;max-width:420px;padding:18px;font-size:19px;font-weight:600;border:0;border-radius:14px;background:var(--btn);color:#fff}
#shot:disabled{background:var(--btn-off);color:var(--muted)}
#info{font-size:13px;color:var(--muted);text-align:center;min-height:1.3em}
#start{position:absolute;inset:0;margin:auto;height:56px;width:220px;font-size:18px;border:0;border-radius:14px;background:var(--btn);color:#fff;z-index:2}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div id="frame"></div>
  <div id="status">Pulsa «Activar cámara»</div>
  <button id="start">Activar cámara</button>
</div>
<div id="bar">
  <button id="shot" disabled>Tomar foto</button>
  <div id="info"></div>
</div>
<canvas id="c" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
  var v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d',{willReadFrequently:true});
  var st=document.getElementById('status'), fr=document.getElementById('frame'), shot=document.getElementById('shot');
  var info=document.getElementById('info'), startBtn=document.getElementById('start');
  var stream=null, track=null, imgCap=null, lastCode='', lastSeen=0, busy=false, flip=false, nativeDet=null, zx=null, saving=false;
  var HOLD=2000; // ms que el botón sigue activo tras la última lectura

  function setStatus(t,ok){st.textContent=t;st.className=ok?'ok':'';}

  async function initDetectors(){
    try{
      if('BarcodeDetector' in window){
        var f=await BarcodeDetector.getSupportedFormats();
        if(f.indexOf('data_matrix')>-1) nativeDet=new BarcodeDetector({formats:['data_matrix']});
      }
    }catch(e){}
    if(!nativeDet && window.ZXing){
      zx=new ZXing.MultiFormatReader();
      var h=new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.DATA_MATRIX]);
      h.set(ZXing.DecodeHintType.TRY_HARDER,true);
      zx.setHints(h);
    }
  }

  async function startCam(){
    startBtn.disabled=true;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}});
    }catch(e){
      setStatus('No se pudo abrir la cámara: '+(e.name||e.message)+'. Revisa los permisos del navegador.');
      startBtn.disabled=false; return;
    }
    startBtn.style.display='none';
    v.srcObject=stream; track=stream.getVideoTracks()[0];
    try{ if(window.ImageCapture) imgCap=new ImageCapture(track); }catch(e){}
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    await initDetectors();
    await v.play().catch(function(){});
    setStatus('Apunta a un código DataMatrix');
    loop();
  }

  function sanitize(s){
    s=s.replace(/[\u0000-\u001f\u007f]/g,'').replace(/[\\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().replace(/^\.+/,'');
    return (s.slice(0,120)||'datamatrix');
  }

  async function scan(){
    if(!v.videoWidth) return null;
    if(nativeDet){
      var r=await nativeDet.detect(v);
      return r.length?r[0].rawValue:null;
    }
    if(!zx) return null;
    var w=Math.min(1600,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth);
    c.width=w; c.height=h; ctx.drawImage(v,0,0,w,h);
    var d=ctx.getImageData(0,0,w,h).data, lum=new Uint8ClampedArray(w*h);
    for(var i=0,j=0;i<d.length;i+=4,j++) lum[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
    var src=new ZXing.RGBLuminanceSource(lum,w,h);
    if(flip) src=src.invert();
    flip=!flip;
    try{
      return zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText();
    }catch(e){ return null; }
  }

  async function loop(){
    if(!stream) return;
    if(!busy && !saving){
      busy=true;
      try{
        var code=await scan();
        if(code){ lastCode=code; lastSeen=Date.now(); }
      }catch(e){}
      busy=false;
    }
    var active=lastCode && (Date.now()-lastSeen<HOLD);
    if(!saving){
      shot.disabled=!active;
      fr.className=active?'ok':'';
      if(active) setStatus('Código: '+lastCode,true);
      else setStatus('Apunta a un código DataMatrix');
    }
    setTimeout(loop,100);
  }

  async function takePhoto(){
    if(saving||!lastCode) return;
    saving=true; shot.disabled=true;
    var code=lastCode, name=sanitize(code)+'.jpg';
    setStatus('Tomando foto…',true);
    try{
      var blob=null, w=0, h=0;
      if(imgCap){
        try{
          var caps=await imgCap.getPhotoCapabilities();
          var o={};
          if(caps.imageWidth&&caps.imageHeight){o.imageWidth=caps.imageWidth.max;o.imageHeight=caps.imageHeight.max;}
          blob=await imgCap.takePhoto(o);
        }catch(e){ blob=null; }
      }
      if(!blob || blob.type.indexOf('jpeg')<0){
        var cv=document.createElement('canvas');
        cv.width=v.videoWidth; cv.height=v.videoHeight;
        cv.getContext('2d').drawImage(v,0,0);
        blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',0.95);});
      }
      var bmp=await createImageBitmap(blob); w=bmp.width; h=bmp.height; bmp.close&&bmp.close();
      await save(blob,name);
      info.textContent='Guardada: '+name+' ('+w+'×'+h+')';
    }catch(e){
      info.textContent=(e&&e.code==='declined')?'Descarga cancelada.':'Error al guardar: '+((e&&e.message)||e);
    }
    saving=false;
  }

  async function save(blob,name){
    var dl=null;
    try{ dl=(window.claude&&claude.use)?await claude.use('downloads'):null; }catch(e){}
    if(dl){ await dl.save({filename:name,data:blob}); return; }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  }

  startBtn.addEventListener('click',startCam);
  shot.addEventListener('click',takePhoto);
})();
</script>
</body>
</html>
